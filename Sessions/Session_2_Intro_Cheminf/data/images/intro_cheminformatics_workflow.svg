<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 270" role="img" aria-labelledby="title desc">
<title id="title">From a SMILES to chemical questions</title><desc id="desc">Read a SMILES, explore atoms and bonds, calculate properties and generate one three-dimensional conformer.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f9fb"/><stop offset="1" stop-color="#f1eef7"/></linearGradient></defs>
<rect width="1280" height="270" rx="24" fill="url(#bg)"/>
<g font-family="Arial, sans-serif"><text x="42" y="42" font-size="14" font-weight="700" letter-spacing="2" fill="#577887">THE NOTEBOOK ROUTE</text>
<text x="42" y="83" font-size="31" font-weight="700" fill="#16394d">One structure, different questions</text>

<path d="M160 141 H1120" fill="none" stroke="#bfd3d7" stroke-width="5"/>
<circle cx="160" cy="141" r="26" fill="#2b7d86" stroke="white" stroke-width="5"/>
<text x="160" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="white">1</text>
<text x="160" y="201" text-anchor="middle" font-size="21" font-weight="700" fill="#17394a">Read a SMILES</text>
<text x="160" y="231" text-anchor="middle" font-size="15" fill="#456273">Recognize the structure</text>
<path d="M441 133 l11 8 -11 8" fill="none" stroke="#638e96" stroke-width="3"/>
<circle cx="480" cy="141" r="26" fill="#2b7d86" stroke="white" stroke-width="5"/>
<text x="480" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="white">2</text>
<text x="480" y="201" text-anchor="middle" font-size="21" font-weight="700" fill="#17394a">Explore the graph</text>
<text x="480" y="231" text-anchor="middle" font-size="15" fill="#456273">Atoms, bonds, and rings</text>
<path d="M761 133 l11 8 -11 8" fill="none" stroke="#638e96" stroke-width="3"/>
<circle cx="800" cy="141" r="26" fill="#ab6747" stroke="white" stroke-width="5"/>
<text x="800" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="white">3</text>
<text x="800" y="201" text-anchor="middle" font-size="21" font-weight="700" fill="#17394a">Calculate properties</text>
<text x="800" y="231" text-anchor="middle" font-size="15" fill="#456273">One molecule, then a CSV</text>
<path d="M1081 133 l11 8 -11 8" fill="none" stroke="#638e96" stroke-width="3"/>
<circle cx="1120" cy="141" r="26" fill="#7968a5" stroke="white" stroke-width="5"/>
<text x="1120" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="white">4</text>
<text x="1120" y="201" text-anchor="middle" font-size="21" font-weight="700" fill="#17394a">Generate a shape</text>
<text x="1120" y="231" text-anchor="middle" font-size="15" fill="#456273">One possible 3D conformer</text>
</g></svg>